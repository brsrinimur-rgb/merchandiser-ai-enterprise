<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merchandiser AI 360 Enterprise</title>
  <style>
    :root{--nav:#0d182b;--nav2:#17243a;--ink:#071a3a;--muted:#60708e;--line:#dce5f2;--bg:#f2f6fc;--card:#fff;--blue:#2e6ff2;--purple:#6250ef;--green:#0b8968;--red:#c83a31;--shadow:0 14px 35px rgba(18,43,82,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:318px;background:var(--nav);color:#d2dbea;overflow:auto;padding:30px 18px}.brand{display:flex;gap:14px;align-items:center;padding:4px 12px 27px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#3978ff,#7b4cff);font-size:22px;font-weight:900;color:#fff}.brand h2{font-size:21px;margin:0 0 6px;color:#fff}.brand small{color:#aab8cd;line-height:1.4}.badge{font-size:11px;background:#32425c;padding:3px 7px;border-radius:20px;margin-left:7px}.group{font-size:12px;letter-spacing:1.5px;color:#8191ab;font-weight:800;margin:20px 10px 8px}.nav{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:12px;cursor:pointer;color:#cbd5e4;margin:2px 0}.nav:hover,.nav.active{background:#253149;color:#fff}.nav i{width:18px;text-align:center;font-style:normal;color:#9cc2ff}.api-state{margin:24px 10px 4px;border:1px solid #2a3953;border-radius:14px;padding:14px;font-size:12px;color:#aab8cc;line-height:1.6}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#37d99a;margin-right:7px}.dot.bad{background:#ef5a51}.main{margin-left:318px;min-height:100vh}.top{height:82px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:3}.crumb{color:#667795}.crumb b{color:var(--ink)}.top-actions{display:flex;gap:12px;align-items:center}.input,.btn,.select,.textarea{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 15px;color:var(--ink)}.btn{font-weight:750;cursor:pointer}.btn:hover{border-color:#91aee5}.btn.primary{color:#fff;border-color:var(--blue);background:var(--blue)}.btn.danger{color:#fff;background:var(--red);border-color:var(--red)}.content{padding:34px;max-width:1700px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.page-head h1{font-size:34px;margin:0 0 8px}.page-head p{margin:0;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.kpi{padding:22px}.label{font-size:12px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}.value{font-size:29px;font-weight:900;margin:11px 0 8px;white-space:nowrap}.sub{font-size:13px;color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px}.section-head{padding:20px 22px;border-bottom:1px solid var(--line);font-weight:850;display:flex;justify-content:space-between;align-items:center}.section-body{padding:22px}.bars{display:flex;align-items:end;gap:13px;height:260px;padding:30px 8px 4px}.bar-col{flex:1;text-align:center;min-width:40px}.bar{min-height:4px;background:linear-gradient(180deg,#6b4dff,#2878ed);border-radius:7px 7px 3px 3px}.bar-label{color:#667795;font-size:11px;transform:rotate(-37deg);margin-top:27px;white-space:nowrap}.actions{display:grid;gap:12px}.action{border:1px solid var(--line);border-radius:14px;padding:15px;display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:start}.action .bullet{width:11px;height:11px;border-radius:50%;background:var(--red);margin-top:5px}.action strong{display:block;margin-bottom:5px}.action small{color:var(--muted)}.money{font-weight:850;white-space:nowrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);max-width:360px}.table th{background:#f7f9fd;color:#52627d;position:sticky;top:0}.status{display:inline-flex;border-radius:999px;padding:5px 9px;background:#eaf0ff;color:#3552ab;font-size:11px;font-weight:800}.status.ready,.status.success{background:#e5f7f0;color:#087c5d}.status.configuration_required,.status.failed{background:#fff0ed;color:#af302a}.connectors{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:20px}.connector{padding:22px}.connector-top{display:flex;justify-content:space-between;gap:15px}.connector h3{margin:0 0 5px}.meta{color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.metric{background:#f7f9fd;border-radius:11px;padding:11px}.metric b{display:block;font-size:18px;margin-top:6px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.controls>*{width:100%}.output{background:#0a1426;color:#c9d8ee;border-radius:14px;padding:16px;min-height:100px;max-height:300px;overflow:auto;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap}.empty,.error{padding:70px 25px;text-align:center}.error h3{font-size:20px}.error p{color:var(--muted)}.notice{padding:16px;border-left:4px solid var(--blue);background:#eaf1ff;border-radius:12px;color:#324a73;margin-bottom:18px}.loader{width:36px;height:36px;border:4px solid #dce5f2;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1300px){.kpis{grid-template-columns:repeat(3,1fr)}.sidebar{width:280px}.main{margin-left:280px}}@media(max-width:850px){.sidebar{position:relative;width:100%;height:auto}.main{margin:0}.top{position:relative;padding:12px;height:auto}.content{padding:20px}.kpis{grid-template-columns:1fr 1fr}.grid2,.connectors{grid-template-columns:1fr}.top-actions .input{display:none}}@media(max-width:520px){.kpis{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">M</div><div><h2>Merchandiser AI<br>Enterprise <span class="badge">1.0</span></h2><small>Retail Planning, Buying<br>& Decision Intelligence</small></div></div><div id="nav"></div><div class="api-state"><span id="apiDot" class="dot bad"></span><b id="apiLabel">Checking API…</b><br><span id="apiDetail">FastAPI at port 8000</span></div></aside><main class="main"><header class="top"><div class="crumb">Merchandiser AI 360 / <b id="crumb">Executive Dashboard</b></div><div class="top-actions"><input class="input" placeholder="Your name / role"><button class="btn" onclick="window.open(API+'/docs','_blank')">API Docs</button><button class="btn" onclick="render(current)">Refresh</button></div></header><div id="content" class="content"></div></main></div>
<script>
const API=window.MERCH_API_BASE||'http://127.0.0.1:8000';
const groups=[
 ['COMMAND CENTER',[['dashboard','▣','Executive Dashboard'],['action-center','⚡','AI Action Center']]],
 ['PLANNING',[['replenishment','↻','Replenishment'],['purchase-planning','◇','Capital Optimizer'],['otb','◎','Open-to-Buy']]],
 ['MERCHANDISING',[['sales-intelligence','↗','Sales Intelligence'],['stock-intelligence','▦','Stock Intelligence'],['category-management','▤','Category Cockpit'],['variant-intelligence','◇','Variant Intelligence'],['markdown-promotion','%','Markdown & Promotion']]],
 ['OPERATIONS',[['transfers','⇄','Store Transfers'],['purchase-planning','▣','Purchase Planning'],['supplier-intelligence','♟','Supplier Performance'],['forecasting','⌁','Forecasting']]],
 ['GOVERNANCE',[['data-import','⇧','Data Import'],['planning-settings','⚙','Planning Settings']]],
 ['ENTERPRISE',[['integration-hub','⛓','Enterprise Integration Hub'],['d365','↔','D365 Connector']]]
];
let current=location.hash.slice(1)||'dashboard';
const titles=Object.fromEntries(groups.flatMap(g=>g[1].map(x=>[x[0],x[2]])));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function money(v){return v==null?'Not set':'SAR '+Number(v).toLocaleString(undefined,{maximumFractionDigits:0})}
function num(v,d=0){return Number(v||0).toLocaleString(undefined,{maximumFractionDigits:d})}
function nav(){document.getElementById('nav').innerHTML=groups.map(([g,items])=>`<div class="group">${g}</div>${items.map(([id,ico,name])=>`<div class="nav ${current===id?'active':''}" onclick="go('${id}')"><i>${ico}</i>${name}</div>`).join('')}`).join('')}
function go(id){current=id;location.hash=id;nav();render(id)}
async function get(path,opt){const r=await fetch(API+path,opt);if(!r.ok){let m='HTTP '+r.status;try{const d=await r.json();m=d.detail||m}catch{}throw new Error(m)}return r.json()}
async function checkApi(){try{const d=await get('/api/health');apiDot.className='dot';apiLabel.textContent='API connected locally';apiDetail.textContent=`${d.service} · ${d.cached_rows} positions`}catch(e){apiDot.className='dot bad';apiLabel.textContent='API disconnected';apiDetail.textContent='Run run_all.bat'}}
function head(title,desc,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function failure(e){return `<div class="card error"><h3>Unable to load this module</h3><p>${esc(e.message)}</p><p>Confirm the backend is running at ${API}.</p><button class="btn primary" onclick="render(current)">Try again</button></div>`}
function flatten(v,p='',out={}){if(v==null||typeof v!=='object')out[p]=v;else if(Array.isArray(v))out[p]=v.length;else Object.entries(v).forEach(([k,x])=>flatten(x,p?`${p}.${k}`:k,out));return out}
function table(rows,limit=150){if(!Array.isArray(rows))rows=Object.entries(flatten(rows)).map(([metric,value])=>({metric,value}));if(!rows.length)return '<div class="empty">No records found.</div>';const cols=[...new Set(rows.slice(0,50).flatMap(Object.keys))].slice(0,12);return `<div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,limit).map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bars(rows,key,label){const max=Math.max(...rows.map(x=>Number(x[key])||0),1);return `<div class="bars">${rows.slice(0,8).map(x=>`<div class="bar-col"><div class="bar" style="height:${Math.max(3,(Number(x[key])||0)/max*190)}px"></div><div class="bar-label">${esc(x[label])}</div></div>`).join('')}</div>`}
function actionCard(a){return `<div class="action"><span class="bullet"></span><div><strong>${esc(a.item_name||a.item)} — ${esc(a.ai_action||a.action)}</strong><small>${esc(a.problem||'')} · ${esc(a.store||'')} · ${esc(a.category||'')}</small></div><span class="money">${money(a.impact_value||0)}</span></div>`}
async function dashboard(){const d=await get('/api/dashboard');const s=d.sales,st=d.stock,b=d.buying,a=d.ai;const actions=a.top_recommended_decisions||[];return head('Executive Dashboard','Executive visibility across sales, stock, buying exposure, open-to-buy and high-priority AI actions.',`<button class="btn primary" onclick="go('action-center')">Open AI Actions</button>`)+`<div class="kpis"><div class="card kpi"><div class="label">30-Day Sales</div><div class="value green">${money(s.total_sales_30d)}</div><div class="sub">${num(s.growth_pct,1)}% vs prior period</div></div><div class="card kpi"><div class="label">Gross Margin</div><div class="value">${num(s.gross_margin_pct,1)}%</div><div class="sub">Top: ${esc(s.top_category)}</div></div><div class="card kpi"><div class="label">Inventory Value</div><div class="value">${money(st.stock_value)}</div><div class="sub">${num(st.avg_weeks_of_cover,1)} weeks cover</div></div><div class="card kpi"><div class="label">Recommended Buy</div><div class="value">${money(b.recommended_purchase_value)}</div><div class="sub">Before approval</div></div><div class="card kpi"><div class="label">Stock-out Risk</div><div class="value red">${num(st.out_of_stock_risk_count)}</div><div class="sub">Store-SKU positions</div></div><div class="card kpi"><div class="label">Critical Actions</div><div class="value red">${num(a.critical_actions)}</div><div class="sub">Awaiting action</div></div></div><div class="grid2"><section class="card"><div class="section-head">Cash & Working Capital</div><div class="section-body"><div class="notice"><b>AI Executive Briefing</b><br>Sales are ${num(s.growth_pct,1)}% versus the prior 30 days at ${num(s.gross_margin_pct,1)}% gross margin. ${num(st.out_of_stock_risk_count)} positions require stock-out action.</div><div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div><div class="label">Dead Stock</div><div class="value">${money(st.dead_stock_value)}</div></div><div><div class="label">Overstock</div><div class="value">${money(st.overstock_value)}</div></div><div><div class="label">Supplier Commitments</div><div class="value">${money(b.supplier_commitments)}</div></div></div></div></section><section class="card"><div class="section-head">Top AI Decisions</div><div class="section-body actions">${actions.slice(0,7).map(actionCard).join('')}</div></section></div>`}
async function forecast(){const d=await get('/api/forecasting'),o=d.overall;return head('Forecasting Center','Near-term demand outlook and observed seasonal/promotion signals.')+`<div class="kpis" style="grid-template-columns:repeat(5,1fr)">${[['Next 7 Days',o.next_7_days_units],['Next 30 Days',o.next_30_days_units],['Next 90 Days',o.next_90_days_units],['Trend',o.trend],['Promo Lift',d.seasonal_signal.demand_lift_pct+'%']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div><div class="grid2"><section class="card"><div class="section-head">Category Forecast</div>${table(d.by_category)}</section><section class="card"><div class="section-head">Demand Outlook</div>${bars(d.by_category,'next_30_days_units','category')}</section></div>`}
async function generic(id){const d=await get('/api/'+id);const rows=Array.isArray(d)?d:(Object.values(d).find(Array.isArray)||null);return head(titles[id]||id,'Live decision intelligence from the shared merchandising data model.')+`<section class="card"><div class="section-head">${titles[id]||id}<span class="status success">Live API</span></div>${table(rows||d)}</section>`}
async function integrations(filter=''){const d=await get('/api/integration-hub/connectors');let rows=d.connectors;if(filter)rows=rows.filter(x=>x.id===filter);return head(filter==='d365'?'D365 Connector':'Enterprise Integration Hub','Controlled ERP pull, push, preview, safety and audit operations.',`<button class="btn" onclick="window.open(API+'/docs#/Enterprise%20Integration%20Hub','_blank')">Open API Schema</button>`)+`<div class="notice"><b>Safe by design:</b> test the Sandbox first. D365 write-back stays disabled until UAT approval and <code>D365_ENABLE_WRITEBACK=true</code>.</div><div class="connectors">${rows.map(connectorCard).join('')}</div><section class="card" style="margin-top:20px"><div class="section-head">Sync History <button class="btn" onclick="loadLogs()">Refresh Logs</button></div><div id="logs"><div class="loader"></div></div></section>`}
function connectorCard(c){const miss=c.missing_configuration||[],m=c.metrics;return `<section class="card connector"><div class="connector-top"><div><h3>${esc(c.name)}</h3><div class="meta">${esc(c.vendor)} · ${esc(c.authentication)}</div></div><span class="status ${c.status}">${esc(c.status.replaceAll('_',' '))}</span></div>${miss.length?`<p class="meta"><b>Missing configuration:</b> ${esc(miss.join(', '))}</p>`:''}<div class="metrics"><div class="metric"><span class="label">Pulled</span><b>${num(m.records_pulled)}</b></div><div class="metric"><span class="label">Pushed</span><b>${num(m.records_pushed)}</b></div><div class="metric"><span class="label">Failed</span><b>${num(m.failed_operations)}</b></div><div class="metric"><span class="label">Mode</span><b>${esc(c.mode)}</b></div></div><div class="controls"><button class="btn" onclick="testConn('${c.id}')">Test Connection</button><select class="select" id="entity-${c.id}">${c.pull_entities.map(e=>`<option>${e}</option>`).join('')}</select><button class="btn" onclick="pullData('${c.id}',true)">Pull Preview</button><button class="btn primary" onclick="pullData('${c.id}',false)" ${c.pull_enabled?'':'disabled'}>Pull Data</button></div><div class="output" id="output-${c.id}">Ready.</div></section>`}
async function testConn(id){const el=document.getElementById('output-'+id);el.textContent='Testing…';try{el.textContent=JSON.stringify(await get(`/api/integration-hub/${id}/test`,{method:'POST'}),null,2)}catch(e){el.textContent='Error: '+e.message}}
async function pullData(id,dry){const e=document.getElementById('entity-'+id).value,el=document.getElementById('output-'+id);el.textContent='Working…';try{el.textContent=JSON.stringify(await get(`/api/integration-hub/${id}/pull/${e}?dry_run=${dry}&max_records=100`,{method:'POST'}),null,2);loadLogs()}catch(x){el.textContent='Error: '+x.message}}
async function loadLogs(){const el=document.getElementById('logs');if(!el)return;try{const d=await get('/api/integration-hub/logs');el.innerHTML=table(d.logs)}catch(e){el.innerHTML=failure(e)}}
async function dataImport(){const d=await get('/api/import/entities');return head('Data Import','Validate CSV or Excel data before committing it to the platform.')+`<section class="card"><div class="section-head">Available Entity Templates</div>${table(d)}</section>`}
async function settings(){const d=await get('/api/config/categories');return head('Planning Settings','Category-level service targets, promotions and replenishment controls.')+`<section class="card"><div class="section-head">Category Configuration</div>${table(d)}</section>`}
async function render(id){document.getElementById('crumb').textContent=titles[id]||id;document.getElementById('content').innerHTML='<div class="loader"></div>';try{let html;if(id==='dashboard')html=await dashboard();else if(id==='forecasting')html=await forecast();else if(id==='integration-hub')html=await integrations();else if(id==='d365')html=await integrations('d365');else if(id==='data-import')html=await dataImport();else if(id==='planning-settings')html=await settings();else if(id==='otb')html=head('Open-to-Buy','Budget, actual, committed, remaining and recommended buy control.')+'<div class="card empty">OTB budget import is ready for real company budgets.</div>';else html=await generic(id);document.getElementById('content').innerHTML=html;if(id==='integration-hub'||id==='d365')loadLogs()}catch(e){document.getElementById('content').innerHTML=head(titles[id]||id,'')+failure(e)}checkApi()}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==current){current=id;nav();render(id)}});nav();render(current);
</script></body></html>
