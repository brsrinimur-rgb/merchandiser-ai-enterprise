(--line);border-radius:12px;padding:12px;background:#fbfcff}.whyCard small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.whyCard b{display:block;font-size:17px;margin-top:6px}.kanbanCard[draggable=true]{cursor:grab}.kanbanCard.dragging{opacity:.45}.kanbanCol.dropTarget{outline:2px dashed var(--brand);outline-offset:2px}.kanbanActions{display:flex;gap:6px;margin-top:9px}.kanbanActions button{font-size:10px;padding:5px 7px}.copilotEvidence{border-left:3px solid var(--brand);background:var(--soft);padding:10px 12px;border-radius:8px;margin-top:8px;font-size:11px}.sourceChip{display:inline-flex;padding:3px 7px;background:#eef2f8;border-radius:99px;margin:3px 3px 0 0;font-size:9px;color:#475467}.compareTable{display:grid;grid-template-columns:160px repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.compareTable>div{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px}.compareTable .head{font-weight:850;background:#f8fafc}.compareTable .best{background:#effbf6;color:#087a55;font-weight:800}.alertStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.alertTile{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}.alertTile:hover{border-color:var(--brand)}.alertTile b{font-size:20px}.alertTile span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.clickableRow{cursor:pointer}.clickableRow:hover{background:var(--soft)}

<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">M</div><div><h1>Merchandiser AI Enterprise <span class="vtag">v9</span></h1><small>Interactive Retail Planning, Buying & Decision Intelligence</small></div></div>
  <div id="nav" class="nav"></div>
  <div class="sidefoot"><span class="dot"></span><b>API connected locally</b><br>Planning data refreshes from FastAPI at port 8000.</div>
</aside>
<section class="main">
  <header class="topbar"><div class="crumb">Merchandiser AI 360 / <strong id="crumb">Executive Dashboard</strong></div><div class="topactions"><input id="globalActor" class="actor" placeholder="Your name / role"><button id="themeBtn" class="iconbtn" title="Dark / light mode">◐</button><button id="apiBtn" class="iconbtn">API Docs</button><button id="refreshBtn" class="iconbtn">Refresh</button></div></header>
  <main id="content" class="content"></main>
</section>
</div>
<div id="modalRoot"></div><div id="aiDockRoot"></div><div class="aiDock"><button onclick="openAIDock()">✦ AI Summary</button></div><div id="toast" class="toast hidden"></div>
<script>
const API=window.MERCH_API_BASE||'http://127.0.0.1:8000';
const money=v=>v==null||Number.isNaN(+v)?'—':new Intl.NumberFormat('en-SA',{style:'currency',currency:'SAR',maximumFractionDigits:0}).format(+v);
const num=v=>v==null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(+v);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);let page='dashboard',cache={},workflowFilter='pending_merchandiser';
const pages=[
 {g:'Command Center',k:'dashboard',i:'◫',l:'Executive Dashboard'},
 {g:'Command Center',k:'actions',i:'⚡',l:'AI Action Center'},
 {g:'Command Center',k:'command',i:'◆',l:'Retail Command Center'},
 {g:'Command Center',k:'copilot',i:'✦',l:'AI Planning Assistant'},
 {g:'Decision Intelligence',k:'twin',i:'◉',l:'Retail Digital Twin'},
 {g:'Decision Intelligence',k:'product360',i:'⊙',l:'Product 360'},
 {g:'Decision Intelligence',k:'stores360',i:'★',l:'Store Performance'},
 {g:'Decision Intelligence',k:'explain',i:'?',l:'Decision Explainability'},
 {g:'Decision Intelligence',k:'timeline',i:'◷',l:'Executive Timeline'},
 {g:'Planning',k:'replenishment',i:'↻',l:'Replenishment'},
 {g:'Planning',k:'capital',i:'◈',l:'Capital Optimizer'},
 {g:'Planning',k:'otb',i:'◎',l:'Open-to-Buy'},
 {g:'Merchandising',k:'sales',i:'↗',l:'Sales Intelligence'},
 {g:'Merchandising',k:'stock',i:'▦',l:'Stock Intelligence'},
 {g:'Merchandising',k:'category',i:'▤',l:'Category Cockpit'},
 {g:'Merchandising',k:'variants',i:'◇',l:'Variant Intelligence'},
 {g:'Merchandising',k:'markdown',i:'%',l:'Markdown & Promotion'},
 {g:'Operations',k:'transfers',i:'⇄',l:'Store Transfers'},
 {g:'Operations',k:'purchase',i:'▣',l:'Purchase Planning'},
 {g:'Operations',k:'suppliers',i:'♙',l:'Supplier Performance'},
 {g:'Operations',k:'forecast',i:'⌁',l:'Forecasting'},
 {g:'Governance',k:'workflow',i:'✓',l:'Approval Center'},
 {g:'Governance',k:'workflowboard',i:'▥',l:'Workflow Board'},
 {g:'Governance',k:'imports',i:'⇧',l:'Data Import'},
 {g:'Governance',k:'settings',i:'⚙',l:'Planning Settings'},
 {g:'Enterprise',k:'integrationhub',i:'⛓',l:'Enterprise Integration Hub'},
 {g:'Enterprise',k:'d365',i:'↔',l:'D365 Connector'}
];
const descriptions={
 dashboard:'Executive visibility across sales, stock, buying exposure, open-to-buy and high-priority AI actions.',
 actions:'A single prioritized list of actions that protect sales, margin and inventory capital.',
 command:'A CEO-level command center combining risk, opportunity, inventory exposure and workflow status.',
 copilot:'Ask business questions and receive evidence-backed answers from the live planning APIs.',
 twin:'Simulate a buying decision before approval and quantify sales, margin, OTB, working-capital and inventory risk.',
 product360:'A complete SKU view across stores, sales, stock, forecast, risk and replenishment decisions.',
 stores360:'Rank stores by sales, margin, inventory exposure, stock-out risk and AI health score.',
 explain:'Open any store-SKU recommendation and see the demand, stock, lead-time, service-level and financial drivers behind it.',
 timeline:'A chronological executive view of AI recommendations, edits, approvals, rejections and generated purchase orders.',
 replenishment:'Demand-based reorder recommendations with service levels, safety stock, lead-time variability, promotions and case-pack controls.',
 capital:'Transfer-first capital optimization that reduces new purchasing before consuming category OTB.',
 otb:'Category budgets, commitments, receipts, stock targets and available buying capacity.',
 sales:'Best sellers, store performance, category growth and margin contribution.',stock:'Fast, slow, dead, overstock and stock-out risk analysis.',
 category:'Category growth, cover, margin and recommended buying action.',variants:'Size and color performance plus broken assortment detection.',
 markdown:'Markdown candidates, do-not-discount protection and bundle opportunities.',transfers:'Move existing inventory from excess stores to demand stores before buying more.',
 purchase:'Supplier, category, MOQ and purchase-priority planning.',suppliers:'Supplier fill-rate, delivery reliability and performance scorecards.',
 forecast:'Near-term demand outlook and observed seasonal/promotion signals.',workflow:'Controlled AI recommendation review through Merchandiser, Buyer and Final Approval to PO Ready.',
 imports:'Validate and commit real CSV/XLSX data with row-level error reporting.',settings:'Category service levels, promotion windows, OTB budgets and closing-stock targets.',integrationhub:'Unified pull/push connectors, capability control, test tools and synchronization logs for ERP and commerce systems.',d365:'Configure, test and monitor Microsoft D365 Finance & Supply Chain data synchronization.'
};
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2800)}
async function api(path,opt={}){let r=await fetch(API+path,opt);if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||`${r.status} ${r.statusText}`)}return r.json()}
function renderNav(){let groups=[...new Set(pages.map(x=>x.g))],html='';for(const g of groups){html+=`<div class="navgroup">${g}</div>`;html+=pages.filter(x=>x.g===g).map(x=>`<button class="${page===x.k?'active':''}" data-page="${x.k}"><span class="ico">${x.i}</span>${x.l}</button>`).join('')}$('#nav').innerHTML=html;$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;render()}}
function head(title,actions=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${descriptions[page]||''}</p></div><div class="pageactions">${actions}</div></div>`}
function loading(){return '<div class="panel"><div class="loading"><span class="spinner"></span><br>Loading live retail data…</div></div>'}
function kpi(label,value,note='',cls=''){return `<div class="kpi"><div class="lbl">${label}</div><div class="val ${cls}">${value}</div><div class="note">${note}</div></div>`}
function badge(v){let s=String(v??'').toLowerCase(),c=s.includes('critical')||s.includes('emergency')||s.includes('over budget')||s==='dead'?'bad':s.includes('high')||s.includes('warn')||s.includes('overstock')||s.includes('exception')?'warn':s.includes('good')||s.includes('normal')||s.includes('within')||s.includes('po_ready')?'good':'info';return `<span class="pill ${c}">${esc(String(v??'—').replaceAll('_',' '))}</span>`}
function actionCard(x){let pr=(x.priority||'').toLowerCase();return `<div class="actioncard"><span class="prio ${pr}"></span><div><strong>${esc(x.item_name||x.item)} — ${esc(x.ai_action)}</strong><p>${esc(x.problem)} · ${esc(x.store)} · ${esc(x.category)}</p></div><b>${x.impact_value!=null?money(x.impact_value):''}</b></div>`}
function table(rows,cols){if(!rows||!rows.length)return '<div class="empty">No records available.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof c[2]==='function'?c[2](r):esc(r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function chart(rows,labelKey,valueKey,formatter=num,limit=8){let d=(rows||[]).slice(0,limit),max=Math.max(...d.map(x=>+x[valueKey]||0),1);return `<div class="chartlist">${d.map(x=>`<div class="chartrow"><div class="name">${esc(x[labelKey])}</div><div class="metricbar"><i style="width:${Math.max(2,(+x[valueKey]||0)/max*100)}%"></i></div><b>${formatter(x[valueKey])}</b></div>`).join('')}</div>`}
async function render(){renderNav();let p=pages.find(x=>x.k===page);$('#crumb').textContent=p?.l||page;$('#content').innerHTML=head(p?.l||page)+loading();try{if(page==='dashboard')await dashboard();else if(page==='actions')await actions();else if(page==='command')await commandCenter();else if(page==='copilot')await copilot();else if(page==='twin')await digitalTwin();else if(page==='product360')await product360();else if(page==='stores360')await storePerformance();else if(page==='explain')await explainability();else if(page==='timeline')await executiveTimeline();else if(page==='replenishment')await replenishment();else if(page==='capital')await capital();else if(page==='otb')await otb();else if(page==='sales')await sales();else if(page==='stock')await stock();else if(page==='category')await category();else if(page==='variants')await variants();else if(page==='markdown')await markdown();else if(page==='transfers')await transfers();else if(page==='purchase')await purchase();else if(page==='suppliers')await suppliers();else if(page==='forecast')await forecast();else if(page==='workflow')await workflow();else if(page==='workflowboard')await workflowBoard();else if(page==='imports')await imports();else if(page==='settings')await settings();else if(page==='integrationhub')await integrationHub();else if(page==='d365')await d365Hub()}catch(e){$('#content').innerHTML=head(p?.l||page)+`<div class="panel"><div class="empty"><b>Unable to load this module</b><br><br>${esc(e.message)}<br><br>Confirm the backend is running at ${API}.</div></div>`}}
async function dashboard(){let [d,e]=await Promise.all([api('/api/dashboard'),api('/api/v7/executive-intelligence')]);cache.dashboard=d;let s=d.sales||{},st=d.stock||{},b=d.buying||{},a=d.ai||{},h=e.health||{},c=e.capital||{},p=e.priorities||{};$('#content').innerHTML=head('Executive Dashboard','<button class="btn primary" onclick="page=\'actions\';render()">Open AI Actions</button>')+`<div class="kpis">${kpi('30-Day Sales',money(s.total_sales_30d),`${num(s.growth_pct)}% growth`,s.growth_pct>=0?'up':'down')}${kpi('Gross Margin',`${num(s.gross_margin_pct)}%`,`Top category: ${esc(s.top_category)}`)}${kpi('Stock Value',money(st.stock_value),`${num(st.avg_weeks_of_cover)} weeks average cover`)}${kpi('Open-to-Buy',money(b.open_to_buy),`${b.budgeted_category_count||0} budgeted categories`)}${kpi('Business Health',`${num(h.business)}%`,`${p.emergency_orders||0} emergency orders`,h.business>=80?'up':'down')}</div><div class="panel"><div class="panelhead"><h3>Executive Health</h3></div><div class="panelbody"><div class="healthGrid">${[['Financial',h.financial],['Inventory',h.inventory],['Supply Chain',h.supply_chain],['OTB',h.otb]].map(x=>`<div class="healthCard"><div class="muted">${x[0]}</div><div class="score">${num(x[1])}%</div><div class="metricbar"><i style="width:${Math.max(0,Math.min(100,x[1]||0))}%"></i></div></div>`).join('')}</div><div style="height:14px"></div><div class="briefing"><b>AI Executive Briefing</b><br>${esc(e.briefing)}</div></div></div><div style="height:16px"></div><div class="grid two"><div class="panel"><div class="panelhead"><h3>Cash & Working Capital</h3></div><div class="panelbody"><div class="grid equal"><div class="bigcallout"><div class="tiny">INVENTORY AT RISK</div><div class="big">${money(c.inventory_at_risk)}</div><p>Dead and overstock inventory requiring transfer, markdown or assortment action.</p></div><div>${kpi('Revenue at Risk',money(c.revenue_at_risk),'Potential 30-day lost sales')}${kpi('Potential Recovery',money(c.potential_recovery),'Transfer and stock recovery opportunity')}${kpi('Transfer Opportunities',num(p.transfer_opportunities),'Use stock before new buying')}</div></div></div></div><div class="panel"><div class="panelhead"><h3>Top AI Decisions</h3></div><div class="panelbody actionslist">${(a.top_recommended_decisions||[]).map(x=>actionCard(x)).join('')||'<div class="empty">No actions.</div>'}</div></div></div>`}
async function actions(){let rows=await api('/api/action-center');$('#content').innerHTML=head('AI Action Center')+`<div class="kpis">${kpi('Total Actions',rows.length,'Prioritized across all modules')}${kpi('Critical',rows.filter(x=>x.priority==='Critical').length,'Immediate response required','down')}${kpi('High Priority',rows.filter(x=>x.priority==='High').length,'Action this planning cycle')}${kpi('Potential Impact',money(rows.reduce((s,x)=>s+(+x.impact_value||0),0)),'Value linked to listed actions')}${kpi('Categories',new Set(rows.map(x=>x.category)).size,'Categories requiring attention')}</div><div class="panel"><div class="panelhead"><h3>Prioritized Retail Actions</h3><div class="toolbar"><input id="actionSearch" placeholder="Search action"></div></div><div id="actionTable">${actionTable(rows)}</div></div>`;$('#actionSearch').oninput=e=>{let q=e.target.value.toLowerCase();$('#actionTable').innerHTML=actionTable(rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}}
function actionTable(rows){return table(rows,[['priority','Priority',r=>badge(r.priority)],['item','Item'],['item_name','Description'],['store','Store'],['category','Category'],['problem','Problem'],['ai_action','Recommended Action'],['impact_value','Impact',r=>money(r.impact_value)]])}
async function replenishment(){let rows=await api('/api/replenishment?only_action=true');$('#content').innerHTML=head('Replenishment Workspace')+`<div class="kpis">${kpi('Actionable Lines',rows.length,'Store × SKU recommendations')}${kpi('Suggested Units',num(rows.reduce((s,x)=>s+(+x.suggested_order_qty||0),0)),'Before approval')}${kpi('Emergency Units',num(rows.reduce((s,x)=>s+(+x.emergency_order_qty||0),0)),'Lead-time stockout protection','down')}${kpi('Display Top-up',num(rows.reduce((s,x)=>s+(+x.display_topup_qty||0),0)),'Minimum shelf presence')}${kpi('OOS-corrected Lines',rows.filter(x=>(+x.days_out_of_stock_30||0)>0).length,'Demand corrected for lost sales')}</div><div class="panel"><div class="panelhead"><h3>Recommended Orders</h3><div class="toolbar"><input id="repSearch" placeholder="Search item/store"><select id="repType"><option value="">All</option><option value="emergency">Emergency</option><option value="promo">Promotion uplift</option><option value="oos">OOS corrected</option></select></div></div><div id="repTable">${repTable(rows)}</div></div>`;let apply=()=>{let q=$('#repSearch').value.toLowerCase(),t=$('#repType').value;let f=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q)&&(!t||(t==='emergency'&&x.emergency_order_qty>0)||(t==='promo'&&x.promo_mult_lt>1)||(t==='oos'&&x.days_out_of_stock_30>0)));$('#repTable').innerHTML=repTable(f)};$('#repSearch').oninput=apply;$('#repType').onchange=apply}
function repTable(r){return table(r,[['store_name','Store'],['item_code','Item'],['item_name','Description'],['category','Category'],['ads_30','ADS',x=>num(x.ads_30)],['on_hand','On Hand'],['incoming_stock','Incoming'],['safety_stock','Safety Stock',x=>num(x.safety_stock)],['suggested_order_qty','Suggested Qty',x=>`<b>${num(x.suggested_order_qty)}</b>`],['emergency_order_qty','Emergency',x=>x.emergency_order_qty?badge(x.emergency_order_qty):'—'],['service_level_pct','Service Level',x=>`${num(x.service_level_pct)}%`],['case_pack','Case Pack']])}
async function capital(){let d=await api('/api/capital-optimizer');let s=d.summary||{};$('#content').innerHTML=head('Inventory Capital Optimizer','<button class="btn primary" onclick="page=\'workflow\';render()">Send to Approval</button>')+`<div class="kpis">${kpi('Original Ask',money(s.total_original_ask_value),'Raw replenishment requirement')}${kpi('Freed by Transfers',money(s.capital_freed_by_transfer),'Existing stock reused first','up')}${kpi('Net Requirement',money(s.total_net_requirement_value),'After transfers and incoming PO')}${kpi('Recommended PO',money(s.total_recommended_po_value),'OTB-constrained recommendation')}${kpi('Held by OTB',money(s.held_back_by_otb_value),`${s.exception_count||0} exceptions`,'down')}</div><div class="grid two"><div class="panel"><div class="panelhead"><h3>Capital-Optimized Recommendations</h3></div>${table(d.recommendations,[['store_name','Store'],['item_code','Item'],['category','Category'],['original_suggested_qty','Original'],['transfer_applied_qty','Transfer'],['net_requirement_qty','Net Need'],['recommended_po_qty','PO Qty',x=>`<b>${x.recommended_po_qty}</b>`],['recommended_po_value','PO Value',x=>money(x.recommended_po_value)],['exception_flag','Control',x=>x.exception_flag?badge(x.exception_flag):badge('within OTB')]])}</div><div class="panel"><div class="panelhead"><h3>Exceptions</h3></div>${table(d.exceptions,[['item_code','Item'],['store_name','Store'],['category','Category'],['net_requirement_qty','Need'],['recommended_po_qty','Funded'],['exception_flag','Exception',x=>badge(x.exception_flag)]])}</div></div>`}
async function otb(){let r=await api('/api/otb');let budget=r.reduce((s,x)=>s+(+x.monthly_budget||0),0),avail=r.reduce((s,x)=>s+(+x.available_otb||0),0);$('#content').innerHTML=head('Open-to-Buy Control Center')+`<div class="kpis">${kpi('Monthly Budget',money(budget),'Configured category budgets')}${kpi('Available OTB',money(avail),'After actuals and commitments',avail>=0?'up':'down')}${kpi('Commitments',money(r.reduce((s,x)=>s+(+x.commitments||0),0)),'Open purchase commitments')}${kpi('Planned Receipts',money(r.reduce((s,x)=>s+(+x.planned_receipts||0),0)),'Expected within 30 days')}${kpi('Over Budget',r.filter(x=>x.budget_status==='over budget').length,'Categories needing control','down')}</div><div class="panel"><div class="panelhead"><h3>Category OTB Position</h3></div>${table(r,[['category','Category'],['monthly_budget','Budget',x=>money(x.monthly_budget)],['actual_purchases_mtd','Actual Purchases',x=>money(x.actual_purchases_mtd)],['commitments','Commitments',x=>money(x.commitments)],['planned_receipts','Planned Receipts',x=>money(x.planned_receipts)],['available_otb','Available OTB',x=>`<b>${money(x.available_otb)}</b>`],['current_stock_value','Stock Value',x=>money(x.current_stock_value)],['stock_target_gap','Target Gap',x=>money(x.stock_target_gap)],['budget_status','Status',x=>badge(x.budget_status)]])}</div>`}
async function sales(){let d=await api('/api/sales-intelligence');$('#content').innerHTML=head('Sales Intelligence')+`<div class="grid equal"><div class="panel"><div class="panelhead"><h3>Best Sellers</h3></div><div class="panelbody">${chart(d.best_sellers,'item_name','sales_value_30',money,10)}</div></div><div class="panel"><div class="panelhead"><h3>Store Performance</h3></div><div class="panelbody">${chart(d.store_performance,'store_name','sales_value_30',money,10)}</div></div></div><div style="height:16px"></div><div class="panel"><div class="panelhead"><h3>Category Performance</h3></div>${table(d.category_performance,[['category','Category'],['sales_value_30','Sales',x=>money(x.sales_value_30)],['margin_30','Margin',x=>money(x.margin_30)],['margin_pct','Margin %',x=>`${num(x.margin_pct)}%`],['growth_pct','Growth',x=>badge(`${num(x.growth_pct)}%`)],['qty_30','Units']])}</div>`}
async function stock(){let d=await api('/api/stock-intelligence'),s=d.summary||{};$('#content').innerHTML=head('Stock Intelligence')+`<div class="kpis">${kpi('Total Stock',money(s.total_stock_value),'Inventory at cost')}${kpi('Dead Stock',money(s.dead_stock_value),'No-sale inventory','down')}${kpi('Overstock',money(s.overstock_value),'Excess cover')}${kpi('Stock-out Risk',s.out_of_stock_risk_count||0,'Active demand, no stock','down')}${kpi('Fast Moving',s.fast_moving||0,'High velocity positions','up')}</div><div class="panel"><div class="panelhead"><h3>Stock Health Detail</h3><div class="toolbar"><input id="stockSearch" placeholder="Search"><select id="stockStatus"><option value="">All status</option>${['understock','overstock','dead','fast_moving','slow_moving','normal'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div id="stockTable">${stockTable(d.detail)}</div></div>`;let f=()=>{let q=$('#stockSearch').value.toLowerCase(),st=$('#stockStatus').value;$('#stockTable').innerHTML=stockTable(d.detail.filter(x=>JSON.stringify(x).toLowerCase().includes(q)&&(!st||x.stock_status===st)))};$('#stockSearch').oninput=f;$('#stockStatus').onchange=f}
function stockTable(r){return table(r,[['store_name','Store'],['item_code','Item'],['item_name','Description'],['category','Category'],['on_hand','On Hand'],['ads_30','ADS',x=>num(x.ads_30)],['weeks_of_cover','Weeks Cover',x=>num(x.weeks_of_cover)],['stock_value','Value',x=>money(x.stock_value)],['days_since_sale','Days Since Sale'],['stock_status','Status',x=>badge(x.stock_status)]])}
async function category(){let r=await api('/api/category-management');$('#content').innerHTML=head('Category Cockpit')+`<div class="grid equal"><div class="panel"><div class="panelhead"><h3>Category Sales</h3></div><div class="panelbody">${chart(r,'category','sales_value_30',money,12)}</div></div><div class="panel"><div class="panelhead"><h3>Stock Exposure</h3></div><div class="panelbody">${chart([...r].sort((a,b)=>b.stock_value-a.stock_value),'category','stock_value',money,12)}</div></div></div><div style="height:16px"></div><div class="panel"><div class="panelhead"><h3>Category Decisions</h3></div>${table(r,[['category','Category'],['sales_value_30','Sales',x=>money(x.sales_value_30)],['margin_pct','Margin %',x=>`${num(x.margin_pct)}%`],['growth_pct','Growth',x=>`${num(x.growth_pct)}%`],['stock_value','Stock Value',x=>money(x.stock_value)],['weeks_of_cover','Weeks Cover',x=>num(x.weeks_of_cover)],['recommendation','AI Recommendation',x=>badge(x.recommendation)]])}</div>`}

async function commandCenter(){
  let [d,actions,otb,cap,wf,forecast]=await Promise.all([api('/api/dashboard'),api('/api/action-center'),api('/api/otb'),api('/api/capital-optimizer'),api('/api/workflow/summary'),api('/api/forecasting')]);
  let critical=actions.filter(x=>x.priority==='Critical').length,high=actions.filter(x=>x.priority==='High').length;
  let riskBase=(critical*3+high+((d.stock?.out_of_stock_risk_count)||0));let score=Math.max(18,Math.min(96,Math.round(92-riskBase/8)));
  let over=(otb||[]).filter(x=>x.budget_status==='over budget').length, capsum=cap.summary||{};
  let bars=[d.sales?.growth_pct||0,d.stock?.avg_weeks_of_cover||0,critical+2,high+3,Math.abs(forecast.overall?.next_7_days_units||0)/1000,Math.max(1,score/10)];
  $('#content').innerHTML=head('Retail Command Center','<button class="btn primary" onclick="page=\'copilot\';render()">Ask Planning Assistant</button>')+`
  <div class="hero"><div><h2>Good evening, Retail Leadership Team</h2><p>Your live command center highlights where inventory capital, availability and buying decisions require attention. All values are connected to the current planning database.</p><div class="miniGrid" style="margin-top:18px"><div><small>Sales Growth</small><div style="font-size:22px;font-weight:900">${num(d.sales?.growth_pct)}%</div></div><div><small>Critical Actions</small><div style="font-size:22px;font-weight:900">${critical}</div></div><div><small>Available OTB</small><div style="font-size:22px;font-weight:900">${money(d.buying?.open_to_buy)}</div></div></div></div><div class="heroScore"><div class="scoreRing" style="--score:${score}%"><b>${score}</b></div><div><b>Retail Health Score</b><p style="max-width:170px">Composite view of availability, OTB exposure and action workload.</p></div></div></div>
  <div class="kpis">${kpi('30-Day Sales',money(d.sales?.total_sales_30d),`${num(d.sales?.growth_pct)}% growth`,d.sales?.growth_pct>=0?'up':'down')}${kpi('Capital Saved by Transfers',money(capsum.capital_freed_by_transfer),'Avoided new purchasing')}${kpi('Recommended PO',money(capsum.total_recommended_po_value),'After transfer and OTB')}${kpi('OTB Exceptions',num(capsum.exception_count),`${over} categories over budget`,over?'down':'up')}${kpi('Workflow Value',money(Object.values(wf).reduce((s,x)=>s+(x?.value||0),0)),'Across all approval stages')}</div>
  <div class="grid two"><div class="panel"><div class="panelhead"><h3>Executive Signals</h3></div><div class="panelbody"><div class="miniGrid"><div class="miniCard"><div class="muted">Inventory Exposure</div><div class="n">${money(d.stock?.stock_value)}</div><div class="spark">${bars.map((x,i)=>`<i style="height:${Math.max(8,Math.min(100,Math.abs(x)*8))}%"></i>`).join('')}</div></div><div class="miniCard"><div class="muted">Dead + Overstock</div><div class="n">${money((d.stock?.dead_stock_value||0)+(d.stock?.overstock_value||0))}</div><div class="note">Capital recovery opportunity</div></div><div class="miniCard"><div class="muted">Forecast Direction</div><div class="n">${badge(forecast.overall?.trend||'stable')}</div><div class="note">Next 30 days: ${num(forecast.overall?.next_30_days_units)} units</div></div></div></div></div><div class="panel"><div class="panelhead"><h3>Top Decisions Today</h3></div><div class="panelbody actionslist">${actions.slice(0,6).map(actionCard).join('')}</div></div></div>`;
}

async function copilot(){
 $('#content').innerHTML=head('AI Planning Assistant')+`<div class="assistantLayout"><div class="panel"><div class="panelhead"><h3>Suggested Questions</h3></div><div class="panelbody promptList">${['What should we buy today?','Which categories are over budget?','Where can we transfer stock before buying?','What are the biggest inventory risks?','Summarize the approval workflow.','Which category should management focus on?'].map(q=>`<button class="promptBtn" onclick="askAssistant('${q.replaceAll("'","\'")}')">${q}</button>`).join('')}</div></div><div class="panel"><div class="panelhead"><h3>Planning Conversation</h3><span class="pill info">Live API evidence</span></div><div class="panelbody chatbox"><div id="messages" class="messages"><div class="msg ai"><b>Planning Assistant</b><br>I can answer questions using the current dashboard, action center, OTB, capital optimizer and workflow data. This v5 assistant is evidence-based and rule-driven; an external language-model connection can be added later.</div></div><div class="chatInput"><input id="chatQuestion" placeholder="Ask about buying, stock, transfers, OTB or approvals"><button class="btn primary" id="chatSend">Ask</button></div></div></div></div>`;

async function askAssistant(q){q=(q||'').trim();if(!q)return;let m=$('#messages');m.innerHTML+=`<div class="msg user">${esc(q)}</div>`;m.scrollTop=m.scrollHeight;try{let [d,a,o,c,w]=await Promise.all([api('/api/dashboard'),api('/api/action-center'),api('/api/otb'),api('/api/capital-optimizer'),api('/api/workflow/summary')]);let low=q.toLowerCase(),answer='';if(low.includes('buy')||low.includes('order')){let top=(c.recommendations||[]).filter(x=>x.recommended_po_qty>0).slice(0,5);answer=`Recommended PO value is <b>${money(c.summary?.total_recommended_po_value)}</b>. Top lines:<br>${top.map(x=>`• ${esc(x.item_code)} at ${esc(x.store_name)}: ${x.recommended_po_qty} units (${money(x.recommended_po_value)})`).join('<br>')||'No funded PO recommendations.'}`;}else if(low.includes('budget')||low.includes('otb')){let over=(o||[]).filter(x=>x.budget_status==='over budget');answer=`Available OTB is <b>${money(d.buying?.open_to_buy)}</b>. ${over.length?`Over-budget categories: ${over.map(x=>esc(x.category)).join(', ')}.`:'No category is currently flagged over budget.'}`;}else if(low.includes('transfer')){answer=`Transfers can free <b>${money(c.summary?.capital_freed_by_transfer)}</b> before new purchasing. Open the Capital Optimizer or Store Transfers page for SKU-level instructions.`;}else if(low.includes('risk')){answer=`There are <b>${d.ai?.critical_actions||0}</b> critical actions and <b>${d.stock?.out_of_stock_risk_count||0}</b> stock-out risks. Dead stock is ${money(d.stock?.dead_stock_value)} and overstock is ${money(d.stock?.overstock_value)}.`;}else if(low.includes('approval')||low.includes('workflow')){answer=`Workflow currently holds ${Object.entries(w).map(([k,v])=>`${k.replaceAll('_',' ')}: ${v.count}`).join(', ')}. Open the Workflow Board for visual review.`;}else if(low.includes('category')||low.includes('focus')){let top=d.sales?.top_category||'—';answer=`The current top category is <b>${esc(top)}</b>. Management should also review ${a.filter(x=>x.item==='Category').slice(0,3).map(x=>esc(x.category)).join(', ')||'categories highlighted in the Action Center'}.`;}else{answer=`Current 30-day sales are <b>${money(d.sales?.total_sales_30d)}</b>, stock value is <b>${money(d.stock?.stock_value)}</b>, and recommended purchase value is <b>${money(d.buying?.recommended_purchase_value)}</b>. Ask a more specific question about buying, OTB, transfers, risk or approvals.`;}m.innerHTML+=`<div class="msg ai"><b>Planning Assistant</b><br>${answer}</div>`;}catch(e){m.innerHTML+=`<div class="msg ai">Unable to retrieve live planning data: ${esc(e.message)}</div>`}m.scrollTop=m.scrollHeight;if($('#chatQuestion'))$('#chatQuestion').value='';}

function svgLineChart(points,labelKey,valueKey,formatter=num){
  if(!points||!points.length)return '<div class="empty">No chart data.</div>';
  const w=700,h=230,pad={l:44,r:18,t:18,b:34},vals=points.map(x=>+x[valueKey]||0),min=Math.min(0,...vals),max=Math.max(...vals,1),span=max-min||1;
  const X=i=>pad.l+(i/(Math.max(1,points.length-1)))*(w-pad.l-pad.r),Y=v=>pad.t+(max-v)/span*(h-pad.t-pad.b);
  const line=points.map((x,i)=>`${i?'L':'M'} ${X(i).toFixed(1)} ${Y(+x[valueKey]||0).toFixed(1)}`).join(' ');
  const area=`M ${X(0)} ${h-pad.b} `+points.map((x,i)=>`L ${X(i)} ${Y(+x[valueKey]||0)}`).join(' ')+` L ${X(points.length-1)} ${h-pad.b} Z`;
  const grids=[0,.25,.5,.75,1].map(t=>{let y=pad.t+t*(h-pad.t-pad.b),v=max-t*span;return `<line class="gridline" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}"/><text class="axislabel" x="2" y="${y+3}">${esc(formatter(v))}</text>`}).join('');
  const dots=points.map((x,i)=>`<circle class="dot" cx="${X(i)}" cy="${Y(+x[valueKey]||0)}" r="3"><title>${esc(x[labelKey])}: ${esc(formatter(x[valueKey]))}</title></circle>`).join('');
  const labels=points.filter((_,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)).map((x)=>{let i=points.indexOf(x);return `<text class="axislabel" text-anchor="middle" x="${X(i)}" y="${h-8}">${esc(String(x[labelKey]).slice(0,12))}</text>`}).join('');
  return `<div class="chartShell"><svg class="svgChart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="v9Area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#2f6fed" stop-opacity="0"/></linearGradient></defs>${grids}<path class="area" d="${area}"/><path class="line" d="${line}"/>${dots}${labels}</svg></div>`
}
function svgBarChart(rows,labelKey,valueKey,formatter=money,limit=10){
  let a=(rows||[]).slice(0,limit),w=700,h=230,pad={l:46,r:16,t:16,b:52},max=Math.max(...a.map(x=>+x[valueKey]||0),1),bw=(w-pad.l-pad.r)/Math.max(1,a.length),bars=a.map((x,i)=>{let v=+x[valueKey]||0,bh=v/max*(h-pad.t-pad.b),xx=pad.l+i*bw+5,yy=h-pad.b-bh;return `<rect class="bar" x="${xx}" y="${yy}" width="${Math.max(8,bw-10)}" height="${bh}"><title>${esc(x[labelKey])}: ${esc(formatter(v))}</title></rect><text class="axislabel" text-anchor="end" transform="translate(${xx+bw/2},${h-8}) rotate(-35)">${esc(String(x[labelKey]).slice(0,15))}</text>`}).join('');
  return `<div class="chartShell"><svg class="svgChart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="v9Bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#2f6fed"/></linearGradient></defs>${bars}</svg></div>`
}

function renderP360Tab(tab){let d=window._p360,p=d.product,s=d.summary,t=d.sales_trend||[],pos=d.store_positions||[],el=$('#p360Tab');if(tab==='trend')el.innerHTML=`<div class="grid equal"><div class="panel"><div class="panelhead"><h3>45-Day Sales Trend</h3></div><div class="panelbody">${svgLineChart(t,'date','quantity',num)}</div></div><div class="panel"><div class="panelhead"><h3>Store Demand</h3></div><div class="panelbody">${svgBarChart([...pos].sort((a,b)=>b.sales_value_30-a.sales_value_30),'store_name','sales_value_30',money,8)}</div></div></div>`;if(tab==='stores')el.innerHTML=`<div class="panel"><div class="panelhead"><h3>Store Inventory Heatmap</h3></div><div class="panelbody"><div class="heatGrid">${pos.map(x=>`<div class="heatCard ${scoreClass(x.weeks_of_cover<1.5?30:x.weeks_of_cover>8?55:90)}"><b>${esc(x.store_name)}</b><small>${x.on_hand} on hand · ${num(x.weeks_of_cover)} weeks cover</small><small>${badge(x.stock_status)}</small></div>`).join('')}</div></div>${table(pos,[['store_name','Store'],['on_hand','On Hand'],['incoming_stock','Incoming'],['ads_30','ADS',x=>num(x.ads_30)],['weeks_of_cover','Cover',x=>num(x.weeks_of_cover)],['sales_value_30','Sales',x=>money(x.sales_value_30)],['suggested_order_qty','Suggested Qty'],['stock_status','Status',x=>badge(x.stock_status)]])}</div>`;if(tab==='economics')el.innerHTML=`<div class="decisionWhy">${[['Unit Cost',money(p.cost)],['Retail Price',money(p.retail_price)],['Gross Margin',money((p.retail_price||0)-(p.cost||0))],['Lead Time',p.lead_time_days+' days'],['MOQ',p.moq],['Case Pack',p.case_pack],['Stock Value',money(s.stock_value)],['30-Day Margin',money(s.margin_30d)]].map(v=>`<div class="whyCard"><small>${v[0]}</small><b>${v[1]}</b></div>`).join('')}</div>`;if(tab==='decisions')el.innerHTML=`<div class="grid equal"><div class="bigcallout"><div class="tiny">AI RECOMMENDED ORDER</div><div class="big">${num(s.suggested_order_qty)} units</div><p>${s.emergency_qty?`${s.emergency_qty} units are emergency requirement.`:'Standard replenishment requirement.'}</p></div><div class="panel"><div class="panelhead"><h3>Decision Drivers</h3></div><div class="panelbody">${chart(pos,'store_name','suggested_order_qty',num,8)}</div></div></div>`}
async function workflowBoard(){let statuses=['pending_merchandiser','pending_buyer','pending_final','po_ready','rejected'],all=await api('/api/workflow/decisions'),by=Object.fromEntries(statuses.map(s=>[s,all.filter(x=>x.status===s)]));$('#content').innerHTML=head('Workflow Kanban','<button class="btn primary" id="boardSync">Sync AI Recommendations</button>')+`<div class="kpis">${statuses.map(s=>kpi(s.replaceAll('_',' '),by[s].length,money(by[s].reduce((a,x)=>a+(+x.otb_impact_value||0),0)))).join('')}</div><div class="kanban">${statuses.map(s=>`<div class="kanbanCol" data-status="${s}"><div class="kanbanHead"><span>${s.replaceAll('_',' ')}</span><span class="pill neutral">${by[s].length}</span></div>${by[s].slice(0,40).map(x=>`<div class="kanbanCard" draggable="${!['po_ready','rejected'].includes(s)}" data-id="${x.id}" data-stage="${x.stage}" onclick="openDecision(${x.id})"><b>${esc(x.item_code)} · ${esc(x.item_name)}</b><small>${esc(x.store_name)} · ${esc(x.category)}</small><small>Qty ${x.current_qty} · ${money(x.otb_impact_value)}</small><div style="margin-top:8px">${x.is_emergency?badge('Emergency'):x.source_exception_flag?badge('OTB exception'):badge('Standard')}</div>${!['po_ready','rejected'].includes(s)?`<div class="kanbanActions"><button class="btn primary" onclick="event.stopPropagation();quickApprove(${x.id},'${x.stage}')">Approve</button><button class="btn danger" onclick="event.stopPropagation();openDecision(${x.id})">Review</button></div>`:''}</div>`).join('')||'<div class="muted">No decisions</div>'}</div>`).join('')}</div>`;$('#boardSync').onclick=async()=>{let r=await api('/api/workflow/sync',{method:'POST'});toast(`${r.created} recommendation(s) added`);workflowBoard()};document.querySelectorAll('.kanbanCard[draggable="true"]').forEach(c=>{c.ondragstart=()=>c.classList.add('dragging');c.ondragend=()=>c.classList.remove('dragging')})}
async function quickApprove(id,stage){let fd=new FormData();fd.append('stage',stage);fd.append('action','approve');fd.append('actor',$('#globalActor').value.trim()||'Planner');await api(`/api/workflow/decisions/${id}/action`,{method:'POST',body:fd});toast('Decision advanced');workflowBoard()}
async function copilot(){$('#content').innerHTML=head('AI Planning Assistant')+`<div class="assistantLayout"><div class="panel"><div class="panelhead"><h3>Decision Questions</h3></div><div class="panelbody promptList">${['What should we buy today?','Which categories are over budget?','How much capital can transfers save?','What are the biggest inventory risks?','Summarize the approval workflow.','Explain the highest-value emergency order.','Which stores have the weakest inventory health?'].map(q=>`<button class="promptBtn" onclick="askAssistantV9('${q.replaceAll("'","\\'")}')">${q}</button>`).join('')}</div></div><div class="panel"><div class="panelhead"><h3>Planning Conversation</h3><span class="pill info">Grounded in live application data</span></div><div class="panelbody chatbox"><div id="messages" class="messages"><div class="msg ai"><b>Planning Assistant</b><br>Ask about replenishment, stock, OTB, transfers, stores, approvals or financial impact. Each answer cites the live modules used.</div></div><div class="chatInput"><input id="chatQuestion" placeholder="Ask a retail planning question"><button class="btn primary" id="chatSend">Ask</button></div></div></div></div>`;$('#chatSend').onclick=()=>askAssistantV9($('#chatQuestion').value);$('#chatQuestion').onkeydown=e=>{if(e.key==='Enter')askAssistantV9(e.target.value)}}
async function askAssistantV9(q){q=(q||'').trim();if(!q)return;let m=$('#messages');m.innerHTML+=`<div class="msg user">${esc(q)}</div>`;m.scrollTop=m.scrollHeight;let [d,a,o,c,w,stores]=await Promise.all([api('/api/dashboard'),api('/api/action-center'),api('/api/otb'),api('/api/capital-optimizer'),api('/api/workflow/summary'),api('/api/v6/store-performance')]),low=q.toLowerCase(),answer='',sources=[];if(low.includes('buy')||low.includes('order')){let top=(c.recommendations||[]).filter(x=>x.recommended_po_qty>0).slice(0,5);answer=`The capital optimizer recommends ${money(c.summary?.total_recommended_po_value)} of POs after transfers and OTB controls. Highest priorities: ${top.map(x=>`${x.item_code} at ${x.store_name}: ${x.recommended_po_qty} units`).join('; ')}.`;sources=['Capital Optimizer','Replenishment','OTB']}else if(low.includes('over budget')||low.includes('otb')){let x=o.filter(y=>y.budget_status==='over budget');answer=x.length?`${x.length} categories are over budget: ${x.map(y=>`${y.category} (${money(y.available_otb)} available)`).join(', ')}.`:'No category is currently over budget.';sources=['Open-to-Buy']}else if(low.includes('transfer')||low.includes('capital')){answer=`Transfer-first optimization can free ${money(c.summary?.capital_freed_by_transfer)} and reduce the net requirement to ${money(c.summary?.total_net_requirement_value)}.`;sources=['Capital Optimizer','Store Transfers']}else if(low.includes('store')||low.includes('weak')){let x=[...(stores||[])].sort((a,b)=>(a.ai_score||0)-(b.ai_score||0)).slice(0,3);answer=`Lowest store health scores: ${x.map(y=>`${y.store_name} (${num(y.ai_score)}%, ${y.stockout_risk_count||0} stock-out risks)`).join('; ')}.`;sources=['Store Performance']}else if(low.includes('workflow')||low.includes('approval')){answer=`Workflow status: ${w.pending_merchandiser||0} with Merchandiser, ${w.pending_buyer||0} with Buyer, ${w.pending_final||0} final approvals, and ${w.po_ready||0} PO-ready decisions.`;sources=['Approval Workflow']}else if(low.includes('risk')||low.includes('emergency')){let x=a.filter(y=>y.priority==='Critical').slice(0,5);answer=`There are ${a.filter(y=>y.priority==='Critical').length} critical actions. Top exposures: ${x.map(y=>`${y.item_name} at ${y.store}: ${y.problem}`).join('; ')}.`;sources=['AI Action Center','Stock Intelligence']}else{answer=`Current sales are ${money(d.sales?.total_sales_30d)} at ${num(d.sales?.gross_margin_pct)}% margin. Inventory value is ${money(d.stock?.stock_value)}, available OTB is ${money(d.buying?.open_to_buy)}, and ${d.ai?.critical_actions||0} critical actions require attention.`;sources=['Executive Dashboard','AI Action Center']}m.innerHTML+=`<div class="msg ai"><b>Planning Assistant</b><br>${esc(answer)}<div class="copilotEvidence"><b>Evidence used</b><br>${sources.map(x=>`<span class="sourceChip">${esc(x)}</span>`).join('')}</div></div>`;m.scrollTop=m.scrollHeight}

$('#refreshBtn').onclick=render;$('#apiBtn').onclick=()=>window.open(`${API}/docs`,'_blank');$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('mai_theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('mai_theme')==='dark')document.body.classList.add('dark');renderNav();

async function integrationHub(){
  let [catalog,st,logs]=await Promise.all([
    api('/api/integration-hub/connectors'),
    api('/api/integration-hub/status'),
    api('/api/integration-hub/logs?limit=100')
  ]);
  let connectors=catalog.connectors||[];
  let health=st.health||{};
  window._hubConnectors=connectors;
  $('#content').innerHTML=head('Enterprise Integration Hub',`<button class="btn" onclick="integrationHub()">Refresh</button><button class="btn primary" onclick="testHubConnector('d365')">Test D365</button>`)+
  `<div class="kpis">${kpi('Installed Connectors',catalog.total||connectors.length,`${catalog.ready_count||0} ready`)}${kpi('Pull Entities',(st.pull_capabilities||[]).length,'ERP → Merchandiser AI')}${kpi('Push Entities',(st.push_capabilities||[]).length,'Approved data → ERP')}${kpi('Records Pulled',num(health.total_records_pulled||0),`${health.failed_operations||0} failed operations`,health.failed_operations?'down':'up')}</div>`+
  `<div class="panel"><div class="panelhead"><h3>Connector Registry</h3><span class="pill ${health.status==='healthy'?'success':'warning'}">${esc(health.status||'unknown')}</span></div><div class="panelbody"><div class="connectorGrid">${connectors.map(connectorCardV12).join('')}</div></div></div>`+
  `<div style="height:16px"></div><div class="grid2"><div class="panel"><div class="panelhead"><h3>Pull Data</h3><span class="muted">Preview first, then commit</span></div><div class="panelbody">${hubPullForm(connectors)}</div></div><div class="panel"><div class="panelhead"><h3>Push Data</h3><span class="pill danger">Controlled write-back</span></div><div class="panelbody">${hubPushForm(connectors)}</div></div></div>`+
  `<div style="height:16px"></div><div class="panel"><div class="panelhead"><h3>Integration Logs</h3><div><select id="hubLogConnector" onchange="filterHubLogs()"><option value="">All connectors</option>${connectors.map(c=>`<option value="${esc(c.key)}">${esc(c.name)}</option>`).join('')}</select> <select id="hubLogStatus" onchange="filterHubLogs()"><option value="">All statuses</option><option value="success">Success</option><option value="failed">Failed</option></select></div></div><div class="panelbody"><div id="hubLogs">${renderHubLogs(logs)}</div></div></div>`+
  `<div style="height:16px"></div><div class="panel"><div class="panelhead"><h3>Operation Output</h3></div><div class="panelbody"><div id="hubResult" class="syncResult">Select a connector action. Client secrets remain server-side and are never sent to this page.</div></div></div>`;
  updateHubPullEntities(); updateHubPushEntities();
}
function connectorCardV12(c){
  let m=c.metrics||{}, ready=c.connection_status==='ready'||c.connection_status==='sandbox';
  return `<div class="connectorCard"><div class="connectorTop"><div><div class="connectorVendor">${esc(c.vendor||c.category||'Connector')}</div><h3>${esc(c.name)}</h3></div><span class="statusBadge ${ready?'ready':'needs'}">${ready?'● Ready':'● Setup required'}</span></div><p>${esc(c.description||'Enterprise data connector')}</p><div class="connectorMeta"><span>${esc(c.auth_type||'API')}</span><span>${esc(c.mode||'read-only')}</span><span>${esc(c.system_type)}</span></div><div class="capRow"><div><b>Pull</b><small>${esc((c.supports_pull||[]).join(', ')||'None')}</small></div><div><b>Push</b><small>${esc((c.supports_push||[]).join(', ')||'None')}</small></div></div><div class="connectorStats"><span>Last success<br><b>${m.last_success?fmtDate(m.last_success):'Never'}</b></span><span>Records pulled<br><b>${num(m.records_pulled||0)}</b></span><span>Errors<br><b>${num(m.failed_operations||0)}</b></span></div>${(c.missing||[]).length?`<div class="missingCfg">Missing: ${esc(c.missing.join(', '))}</div>`:''}<div class="connectorActions"><button class="btn" onclick="testHubConnector('${c.key}')">Test Connection</button>${c.key==='d365'?`<button class="btn primary" onclick="d365Hub()">Configure D365</button>`:''}</div></div>`
}
function hubPullForm(connectors){let pullers=connectors.filter(c=>(c.supports_pull||[]).length);return `<label>Connector</label><select id="hubPullConnector" onchange="updateHubPullEntities()">${pullers.map(c=>`<option value="${c.key}">${esc(c.name)}</option>`).join('')}</select><label>Entity</label><select id="hubPullEntity"></select><div class="formGrid"><div><label>Maximum records</label><input id="hubPullTop" type="number" value="100" min="1" max="50000"></div><div><label>OData/API filter (optional)</label><input id="hubPullFilter" placeholder="e.g. ModifiedDateTime gt 2026-08-01"></div></div><div class="safeBox"><b>Safe sequence</b><br>1. Preview validates mapping without writing. 2. Review output. 3. Run live pull only after validation.</div><div class="buttonRow"><button class="btn" onclick="runHubPull(true)">Preview / Dry Run</button><button class="btn primary" onclick="runHubPull(false)">Pull & Commit</button></div>`}
function hubPushForm(connectors){let pushers=connectors.filter(c=>(c.supports_push||[]).length);return `<label>Connector</label><select id="hubPushConnector" onchange="updateHubPushEntities()">${pushers.map(c=>`<option value="${c.key}">${esc(c.name)}</option>`).join('')}</select><label>Entity</label><select id="hubPushEntity"></select><label>JSON payload</label><textarea id="hubPushPayload" rows="8">{\n  "header": {},\n  "line": {}\n}</textarea><label>Type PUSH to confirm</label><input id="hubPushConfirm" placeholder="PUSH"><div class="safeBox warning"><b>Write-back control</b><br>D365 push is also blocked unless D365_ENABLE_WRITEBACK=true on the backend.</div><button class="btn danger" onclick="runHubPush()">Push to ERP</button>`}
function updateHubPullEntities(){let key=$('#hubPullConnector')?.value,c=(window._hubConnectors||[]).find(x=>x.key===key),sel=$('#hubPullEntity');if(sel)sel.innerHTML=(c?.supports_pull||[]).map(e=>`<option value="${e}">${e.replaceAll('_',' ')}</option>`).join('')}
function updateHubPushEntities(){let key=$('#hubPushConnector')?.value,c=(window._hubConnectors||[]).find(x=>x.key===key),sel=$('#hubPushEntity');if(sel)sel.innerHTML=(c?.supports_push||[]).map(e=>`<option value="${e}">${e.replaceAll('_',' ')}</option>`).join('')}
async function runHubPull(dry){let key=$('#hubPullConnector').value,entity=$('#hubPullEntity').value,top=$('#hubPullTop').value||100,filter=$('#hubPullFilter').value.trim(),url=`/api/integration-hub/${key}/pull/${entity}?dry_run=${dry}&top=${top}${filter?'&filter_expression='+encodeURIComponent(filter):''}`;await hubOperation(url,{method:'POST'},`${dry?'Previewing':'Pulling'} ${entity} from ${key}`);}
async function runHubPush(){let key=$('#hubPushConnector').value,entity=$('#hubPushEntity').value,confirmation=$('#hubPushConfirm').value,payload;try{payload=JSON.parse($('#hubPushPayload').value)}catch(e){toast('Payload is not valid JSON');return}if(confirmation!=='PUSH'){toast('Type PUSH to confirm write-back');return}await hubOperation(`/api/integration-hub/${key}/push/${entity}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload,confirmation})},`Pushing ${entity} to ${key}`);}
async function hubOperation(url,opts,label){let out=$('#hubResult');if(out)out.textContent=label+'…';try{let r=await api(url,opts);if(out)out.textContent=JSON.stringify(r,null,2);toast('Integration operation completed');setTimeout(filterHubLogs,400)}catch(e){if(out)out.textContent=e.message;toast('Integration operation failed')}}
async function testHubConnector(key){let out=$('#hubResult');if(out)out.textContent=`Testing ${key}…`;try{let r=await api(`/api/integration-hub/${key}/test`,{method:'POST'});if(out)out.textContent=JSON.stringify(r,null,2);toast(`${key} connection successful`);setTimeout(integrationHub,500)}catch(e){if(out)out.textContent=e.message;toast(`${key} test failed`)}}
function renderHubLogs(logs){return table(logs,[['ts','Time',r=>fmtDate(r.ts)],['connector','Connector'],['direction','Direction'],['entity','Entity'],['dry_run','Mode',r=>r.dry_run?badge('Preview'):badge('Live')],['status','Status',r=>badge(r.status)],['records','Records'],['message','Message']])}
async function filterHubLogs(){let connector=$('#hubLogConnector')?.value||'',status=$('#hubLogStatus')?.value||'',q=`/api/integration-hub/logs?limit=100${connector?'&connector='+encodeURIComponent(connector):''}${status?'&status='+encodeURIComponent(status):''}`,logs=await api(q);if($('#hubLogs'))$('#hubLogs').innerHTML=renderHubLogs(logs)}

async function d365Hub(){
  let st=await api('/api/integrations/d365/status');
  let configured=!!st.configured;
  let entities=st.entities||{};
  $('#content').innerHTML=head('D365 Integration Hub',`<button class="btn" onclick="testD365()">Test Connection</button><button class="btn primary" onclick="syncAllD365(true)">Dry-Run All</button>`)+
  `<div class="kpis">${kpi('Connection',configured?'Configured':'Not Configured',configured?'Credentials found':'Complete backend/.env',configured?'up':'down')}${kpi('Company',st.company||'—','D365 legal entity')}${kpi('Resource URL',st.resource_url||'—','Finance & Operations environment')}${kpi('Mode',st.mode||'Read only','Safe integration mode')}</div>
  <div class="panel"><div class="panelhead"><h3>Configuration Status</h3></div><div class="panelbody"><div class="d365Status"><span class="statusDot ${configured?'ok':''}"></span><b>${configured?'Ready for connection test':'Configuration required'}</b>${(st.missing||[]).map(x=>badge(x)).join('')}</div><p class="muted">Credentials are read from <span class="mono">backend/.env</span>. The browser never receives the client secret.</p><div class="mono">Required: D365_TENANT_ID, D365_CLIENT_ID, D365_CLIENT_SECRET, D365_RESOURCE_URL, D365_COMPANY</div></div></div>
  <div style="height:16px"></div><div class="panel"><div class="panelhead"><h3>Entity Mapping & Synchronization</h3></div><div class="panelbody"><div class="entityGrid">${Object.entries(entities).filter(([k])=>k!=='purchase_order_headers').map(([k,v])=>`<div class="entityCard"><h4>${esc(k.replaceAll('_',' '))}</h4><div class="mono">${esc(v)}</div><div style="height:12px"></div><button class="btn" onclick="syncD365('${k}',true)">Dry Run</button> <button class="btn primary" onclick="syncD365('${k}',false)">Sync</button></div>`).join('')}</div></div></div>
  <div style="height:16px"></div><div class="panel"><div class="panelhead"><h3>Sync Output</h3></div><div class="panelbody"><div id="d365Result" class="syncResult">No synchronization run in this session.</div></div></div>`;
}
async function testD365(){let out=$('#d365Result');out.textContent='Testing Microsoft Entra ID and D365 OData connection…';try{let r=await api('/api/integrations/d365/test',{method:'POST'});out.textContent=JSON.stringify(r,null,2);toast('D365 connection successful')}catch(e){out.textContent='Connection test failed:\n'+e.message;toast('D365 connection failed')}}
async function syncD365(entity,dry=true){let out=$('#d365Result');out.textContent=`${dry?'Dry-running':'Synchronizing'} ${entity}…`;try{let r=await api(`/api/integrations/d365/sync/${entity}?dry_run=${dry}&top=100`,{method:'POST'});out.textContent=JSON.stringify(r,null,2);toast(`${entity} ${dry?'preview':'sync'} complete`)}catch(e){out.textContent=`${entity} failed:\n${e.message}`;toast('D365 sync failed')}}
async function syncAllD365(dry=true){for(const e of ['stores','suppliers','items','stock','sales','purchase_orders']){await syncD365(e,dry)}}

render();
</script>
